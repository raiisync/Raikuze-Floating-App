
name: Build Raii Floating App

on:
  workflow_dispatch:
  push:
    paths:
      - 'Raii-Floating-App-Source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip Raii-Floating-App-Source.zip

      - name: Build APK
        run: |
          cd RaiiFloatingApp
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Raii-Floating-App-APK
          path: RaiiFloatingApp/app/build/outputs/apk/debug/app-debug.apk
